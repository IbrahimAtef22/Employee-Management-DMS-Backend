<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees - Employee Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Employee System</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/departments-ui">Departments</a>
            <a class="btn btn-outline-light btn-sm" href="/employees-ui">Employees</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>Employees</h3>
        <a class="btn btn-primary" href="/employees-ui/new">Add Employee</a>
    </div>

    <table class="table table-bordered align-middle">
        <tr>
            <th>Image</th>
            <th>Code</th>
            <th>Name</th>
            <th>Department</th>
            <th>Mobile</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>

        <tr th:each="e : ${employees}">
            <td>
                <img th:src="${e.imageUrl != null ? e.imageUrl : '/images/default-avatar.png'}"
                     width="60" height="60">
            </td>
            <td th:text="${e.code}"></td>
            <td th:text="${e.name}"></td>
            <td th:text="${e.departmentName}"></td>
            <td th:text="${e.mobile}"></td>
            <td th:text="${e.salary}"></td>
            <td>
                <a class="btn btn-sm btn-warning"
                   th:href="@{/employees-ui/edit/{id}(id=${e.id})}">Edit</a>
                <a class="btn btn-sm btn-danger"
                   th:href="@{/employees-ui/delete/{id}(id=${e.id})}"
                   onclick="return confirm('Delete employee?')">Delete</a>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
