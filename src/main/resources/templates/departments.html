<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments - Employee Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Employee System</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/departments-ui">Departments</a>
            <a class="btn btn-outline-light btn-sm" href="/employees-ui">Employees</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>Add Department</h3>

    <form method="post" th:object="${department}" enctype="multipart/form-data">
        <div class="mb-2">
            <input class="form-control" th:field="*{code}" placeholder="Code">
            <div class="text-danger" th:errors="*{code}"></div>
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{name}" placeholder="Name">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{description}" placeholder="Description">
        </div>

        <button class="btn btn-primary">Save</button>
    </form>

    <hr>

    <h4>Departments</h4>

    <table class="table table-bordered">
        <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Description</th>
        </tr>
        <tr th:each="d : ${departments}">
            <td th:text="${d.code}"></td>
            <td th:text="${d.name}"></td>
            <td th:text="${d.description}"></td>
        </tr>
    </table>
</div>

</body>
</html>
