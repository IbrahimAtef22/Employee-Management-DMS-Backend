<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Employee System</a>
        <div>
            <a class="btn btn-outline-light btn-sm" href="/departments-ui">Departments</a>
            <a class="btn btn-outline-light btn-sm" href="/employees-ui">Employees</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3 th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'}"></h3>

    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form method="post"
          th:action="@{/employees-ui/save}"
          th:object="${employee}"
          enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <div class="mb-2">
            <input class="form-control" th:field="*{code}" placeholder="Code">
            <div class="text-danger" th:errors="*{code}"></div>
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{name}" placeholder="Name">
            <div class="text-danger" th:errors="*{name}"></div>
        </div>

        <div class="mb-2">
            <input type="date" class="form-control" th:field="*{birthDate}">
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{address}" placeholder="Address">
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{mobile}" placeholder="Mobile">
        </div>

        <div class="mb-2">
            <input class="form-control" th:field="*{salary}" placeholder="Salary">
            <div class="text-danger" th:errors="*{salary}"></div>
        </div>

        <div class="mb-2">
            <select class="form-select" th:field="*{departmentId}">
                <option value="">-- Select Department --</option>
                <option th:each="d : ${departments}"
                        th:value="${d.id}"
                        th:text="${d.name}">
                </option>
            </select>
            <div class="text-danger" th:errors="*{departmentId}"></div>
        </div>

        <div class="mb-3">
            <input type="file" name="image" class="form-control">
            <div class="mt-2" th:if="${employee.imageUrl != null}">
                <img th:src="${employee.imageUrl}" width="100">
            </div>
        </div>

        <button class="btn btn-success">Save</button>
        <a class="btn btn-secondary" href="/employees-ui">Cancel</a>

    </form>
</div>

</body>
</html>
